name: CI

# Trigger workflow on pushes and pull requests to main/develop
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Global permissions required for security features and AWS OIDC integration
permissions:
  contents: read # Allows workflow to checkout the repository code
  id-token: write # Allows requesting the JWT token from GitHub to securely assume AWS IAM roles

jobs:
  # Job to check code quality and run the test suite with a live database
  test:
    name: Test Application
    runs-on: ubuntu-latest

    # Setup database container needed for the testing environment
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devopsdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Pull source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python 3.11 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install pip packages from requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Check for syntax and style violations using Ruff
      - name: Run linting
        run: |
          ruff check .

      # Execute unit/integration tests with Pytest and pass the database URL
      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/devopsdb
        run: |
          pytest -v

  # Job to verify the application builds into a Docker image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      # Pull source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compile Dockerfile without cache and verify essential framework packages are imported cleanly
      - name: Build Docker image
        run: |
          docker build --no-cache -t devops-cloud-platform:${{ github.sha }} .
          docker run --rm \
            --entrypoint python \
            devops-cloud-platform:${{ github.sha }} \
            -c "import fastapi, uvicorn, sqlalchemy, pymysql"

  # Job to analyze the Docker image for security flaws
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      # Pull source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rebuild image cleanly and verify target dependencies run without errors
      - name: Build Docker image
        run: |
          docker build --no-cache -t devops-cloud-platform:scan .
          docker run --rm \
            --entrypoint python \
            devops-cloud-platform:scan \
            -c "import fastapi, uvicorn, sqlalchemy, pymysql"

      # Check image for CRITICAL/HIGH vulnerabilities using Trivy
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "devops-cloud-platform:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # Job to securely authenticate via OIDC and upload verified images to Amazon ECR
  push-to-ecr:
    name: Push Image to Amazon ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: security-scan

    # Inherit required tokens specifically for the AWS handshake
    permissions:
      contents: read
      id-token: write

    steps:
      # Pull source code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Swap short-lived OIDC token for AWS role session (zero long-lived credentials stored)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::570934197541:role/ECR-permissions
          aws-region: ap-south-1

      # Authenticate Docker CLI instance directly against Amazon ECR registry
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Compile production container tag natively targeted for ECR domain mapping
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/devops-cloud-platform:${{ github.sha }} .

      # Push final verified artifact up to ECR secure registry infrastructure
      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/devops-cloud-platform:${{ github.sha }}
