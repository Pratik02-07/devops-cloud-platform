name: CI

# Trigger workflow on pushes and pull requests to main/develop
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devopsdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/devopsdb
        run: |
          pytest -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --no-cache -t devops-cloud-platform:\${{ github.sha }} .
          docker run --rm devops-cloud-platform:\${{ github.sha }} \
            python -m pip show setuptools wheel

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --no-cache -t devops-cloud-platform:scan .
          docker run --rm devops-cloud-platform:scan \
            python -m pip show setuptools wheel

      - name: Verify packaging metadata locations
        run: |
          docker run --rm --entrypoint sh devops-cloud-platform:scan -c \
            "find /usr/local/lib/python3.11/site-packages /usr/lib/python3/dist-packages -maxdepth 2 \( -iname 'setuptools*' -o -iname 'wheel*' \) -print 2>/dev/null || true"

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devops-cloud-platform:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
